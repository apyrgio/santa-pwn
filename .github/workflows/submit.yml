name: Check submission
on: # zizmor: ignore[concurrency-limits]
  # We need `pull_request_target` because PRs come from forks, and only this
  # trigger gives them access to Kenny's age key. This is safe *only* as long
  # as we never execute or install anything from the PR. The only file we take
  # from the PR is `letter.age`, which we check out in a separate directory.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    paths:
      - 'letter.age'
  workflow_dispatch:

permissions: {}

# We deliberately don't set concurrency limits. Every submission must be
# evaluated, even if the submitter pushes a newer one while the first runs.

jobs:
  check-submission:
    name: Check submission
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout Git branches and compare commits
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout the base branch, not the PR's merge commit.
          # This ensures we are running the trusted workflow.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check for a single letter to Santa
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Get the list of changed files for the exact commit that triggered
          # this run. Do not query the live PR, since its head may have moved
          # in the meantime.
          CHANGED_FILES=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --jq '.files[].filename')
          # Check if the only changed file is letter.age
          if [[ "$CHANGED_FILES" != "letter.age" ]]; then
            cat rejection.txt
            exit 1
          fi

      - name: Get encrypted letter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the PR files away from our trusted files.
          path: submission
          persist-credentials: false
          # Download only `letter.age`. Cone mode would also check out every
          # top-level file of the PR, so we disable it.
          sparse-checkout: /letter.age
          sparse-checkout-cone-mode: false
          # Safe, since we never execute anything from the PR.
          allow-unsafe-pr-checkout: true

      - name: Install age
        run: |-
          sudo apt-get update && sudo apt-get install -y age

      - name: Decrypt letter
        env:
          # This is the only workflow in this repo, and it must run unattended,
          # so a dedicated environment would not add any protection.
          KENNYS_AGE_KEY: ${{ secrets.KENNYS_AGE_KEY }} # zizmor: ignore[secrets-outside-env]
        run: |-
          set -euo pipefail
          # Fail with an actionable message if the secret was never populated,
          # instead of age's cryptic "no secret keys found".
          if [[ -z "${KENNYS_AGE_KEY}" ]]; then
            echo "::error::The KENNYS_AGE_KEY repository secret is empty or unset."
            echo "Kenny cannot open any letter until it is set to the age"
            echo "identity matching kenny.pub. No submission can succeed."
            exit 1
          fi
          # Don't follow symlinks to files outside the PR.
          if [[ ! -f submission/letter.age || -L submission/letter.age ]]; then
            echo "letter.age must be a regular file"
            exit 1
          fi
          printf '%s\n' "${KENNYS_AGE_KEY}" \
              | age --decrypt --identity - --output letter submission/letter.age
          rm -rf submission

      - name: Install Dangerzone
        run: |-
          sudo apt-get update && sudo apt-get install ca-certificates -y
          gpg --keyserver hkps://keys.openpgp.org \
              --no-default-keyring --keyring ./fpf-apt-tools-archive-keyring.gpg \
              --recv-keys "DE28 AB24 1FA4 8260 FAC9 B8BA A7C9 B385 2260 4281"
          sudo mkdir -p /etc/apt/keyrings/
          sudo mv fpf-apt-tools-archive-keyring.gpg /etc/apt/keyrings

          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/fpf-apt-tools-archive-keyring.gpg] \
              https://packages.freedom.press/apt-tools-prod ${VERSION_CODENAME?} main" \
              | sudo tee /etc/apt/sources.list.d/fpf-apt-tools.list

          sudo apt update
          sudo apt install -y dangerzone

      - name: Upgrade container image
        run: dangerzone-image upgrade

      - name: Set flag envvars
        run: |-
          echo DZ_RASTER_FLAG=~/secrets/raster.flag >> $GITHUB_ENV
          echo DZ_GVISOR_FLAG=~/secrets/gvisor.flag >> $GITHUB_ENV
          echo DZ_HOST_FLAG=~/secrets/host.flag >> $GITHUB_ENV

      - name: Generate flags
        run: |-
          mkdir ~/secrets
          # Instruct xxd to read from urandom and:
          #
          # 1. Create a hexadecimal string (-p),
          # 2. without newlines (-c 999),
          # 3. and length 32 octets (-l 32),
          #
          # which amounts to 256 bits of entropy.
          xxd -p -c 999 -l 32 /dev/urandom > $DZ_RASTER_FLAG
          xxd -p -c 999 -l 32 /dev/urandom > $DZ_GVISOR_FLAG
          xxd -p -c 999 -l 32 /dev/urandom > $DZ_HOST_FLAG

      - name: Make Dangerzone flag-aware
        run: |-
          sudo patch -p2 -d /usr/lib/python3/dist-packages/dangerzone < dz.patch

      - name: Create test letters
        run: |-
          for flag in ~/secrets/*; do
            text2image --text ${flag} --outputbase image-$(basename ${flag}) \
              --ptsize=12 --font "Liberation Sans"
          done

      - name: Ensure flags can be captured
        run: |-
          sudo apt-get install -y python3-fitz python3-click
          pip install fuzzysearch

          dangerzone-cli *.flag.tif --ocr-lang eng
          for flag in *-safe.pdf; do
            ./check_submission.py -s ${flag} -S ~/secrets
          done

      - name: Sanitize letter to Santa
        # It's fine if the letter cannot be sanitized, as long as it captures a
        # flag and prints it to the stderr of the conversion process.
        continue-on-error: true
        run: |-
          dangerzone-cli letter --ocr-lang eng 2>&1 | tee logs

      - name: Check if any flag was captured
        run: |-
          # Wrap large lines over 500 characters, else the GitHub UI will not
          # show them.
          set -euo pipefail
          if [[ -f letter-safe.pdf ]]; then
            ./check_submission.py -s letter-safe.pdf -l logs -S ~/secrets | fold -w 500
          else
            ./check_submission.py -l logs -S ~/secrets | fold -w 500
          fi
