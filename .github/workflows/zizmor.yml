name: Lint GitHub Actions
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/**'

permissions: {}

# Linting the same ref twice serves no purpose, so supersede in-flight runs.
# (Unlike the submission workflow, where every run must complete.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          persona: auditor
          # Fail the job on findings, instead of uploading SARIF results, which
          # would require `security-events: write`.
          advanced-security: false
